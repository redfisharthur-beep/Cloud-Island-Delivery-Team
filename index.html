<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d2033;color:#fff;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#101b2c;overflow:hidden;box-shadow:0 18px 70px #061321aa}.shell:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #07182a55}.game{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;inset:0;pointer-events:none}.stats{position:absolute;top:3.5%;right:3%;display:flex;gap:9px;align-items:center}.pill{min-height:42px;background:#102b46bd;border:1px solid #ffffff50;border-radius:15px;padding:7px 11px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 12px #20406033}.gemIcon{width:19px;height:21px;filter:drop-shadow(0 0 4px #ffd65a)}#coins{color:#fff2bd;font-weight:850;font-size:14px;min-width:26px}.hearts{display:flex;gap:4px}.heart{width:17px;height:16px;fill:#ff9378;filter:drop-shadow(0 1px 3px #e7675b55)}.heart.off{fill:#ffffff45;filter:none}.controls{position:absolute;inset:auto 0 0;height:31%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4% 3%;pointer-events:none}.cluster{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}.ctrl{width:clamp(48px,9vw,80px);height:clamp(48px,9vw,80px);border:1px solid #e8d5ad88;border-radius:22px;background:linear-gradient(145deg,#24374ddd,#111d31e8);color:#eee2c7;font-size:clamp(20px,4vw,32px);font-weight:800;box-shadow:0 5px 0 #080e19bb,0 10px 24px #050b1680,inset 0 1px #ffffff22;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}.ctrl:active,.ctrl.down{transform:translateY(4px);box-shadow:0 1px 0 #080e19;background:#41566a}.jump{width:clamp(62px,11vw,96px);height:clamp(62px,11vw,96px);border-radius:50%;background:linear-gradient(145deg,#ead4a5,#b99463);color:#263347;box-shadow:0 6px 0 #6e5439,inset 0 1px #fff1 :fullscreen.shell,:fullscreen .shell{width:100vw;height:100dvh;max-width:none;max-height:none;box-shadow:none}.pill{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:#f4e8c96b}.ctrl{backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:transform .12s ease,filter .18s ease,background .18s ease}.ctrl:hover{filter:brightness(1.07)}.start{transition:transform .14s ease,filter .18s ease}.start:hover{filter:brightness(1.08) drop-shadow(0 0 12px #ffe28b88)}@media(orientation:landscape) and (max-height:600px){.shell{width:100vw;height:100dvh;box-shadow:none}.controls{padding-bottom:max(3%,env(safe-area-inset-bottom))}}

</head><body>
<div class="shell"><canvas class="game" id="game" width="960" height="540" aria-label="雲島快遞隊遊戲畫面"></canvas>
<div class="hud"><div class="stats"><div class="pill"><svg class="gemIcon" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 22 10 17 25H7L2 10Z" fill="#ffd65a"/><path d="m12 4 5 7-5 10-5-10Z" fill="#fff1a6"/><path d="m12 4 5 7h-5Z" fill="#fff9d8"/></svg><span id="coins">0/12</span></div><div class="pill hearts" id="lives" aria-label="3"></div></div></div>

</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),H=540;let W=960,dpr=Math.min(window.devicePixelRatio||1,2);ctx.imageSmoothingEnabled=true;const worldArt=new Image();worldArt.src='assets/world-bg.webp';const courierArt=new Image();courierArt.src='assets/courier.webp';
function resizeGame(){const r=c.getBoundingClientRect();if(!r.width||!r.height)return;dpr=Math.min(window.devicePixelRatio||1,2);W=H*r.width/r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(c.width/W,0,0,c.height/H,0,0)}
window.addEventListener('resize',resizeGame);window.addEventListener('fullscreenchange',resizeGame);window.addEventListener('orientationchange',()=>setTimeout(resizeGame,100));resizeGame();
const foxIcon='<img src="assets/courier.webp" alt="" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 9px #16263866)">';
const trophyIcon='<svg viewBox="0 0 120 120"><path d="M38 19h44v23q0 29-22 35Q38 71 38 42Z" fill="#f4c45f"/><path d="M38 27H20v13q0 21 22 24M82 27h18v13q0 21-22 24" fill="none" stroke="#f4c45f" stroke-width="9" stroke-linecap="round"/><path d="M60 77v18M42 101h36" stroke="#a86445" stroke-width="8" stroke-linecap="round"/><path d="m60 29 4 10 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1Z" fill="#fff3c6"/></svg>';
const failIcon='<svg viewBox="0 0 120 120"><path d="M32 76h55a20 20 0 0 0 1-40 30 30 0 0 0-57 7 17 17 0 0 0 1 33Z" fill="#e8f4ee"/><path d="m48 54 24 24m0-24L48 78" stroke="#df8056" stroke-width="8" stroke-linecap="round"/></svg>';
const gemIcon='<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 22 10 17 25H7L2 10Z" fill="#ffd65a"/><path d="m12 4 5 7-5 10-5-10Z" fill="#fff1a6"/></svg>';
function updateLives(){document.getElementById('lives').innerHTML=Array.from({length:3},(_,i)=>`<svg class="heart${i>=lives?' off':''}" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21 2.8 12.2C-3 6.5 5.3-2.3 12 4.3 18.7-2.3 27 6.5 21.2 12.2Z"/></svg>`).join('')}
function showCard(type,withScore=false){document.getElementById('modalIcon').innerHTML=type==='win'?trophyIcon:type==='fail'?failIcon:foxIcon;const score=document.getElementById('scoreIcon');score.innerHTML=gemIcon+`<span>${coins}/12</span>`;score.classList.toggle('hidden',!withScore);document.getElementById('start').innerHTML=type==='start'?'<svg viewBox="0 0 32 32"><path d="M9 5v22l19-11Z"/></svg>':'<svg viewBox="0 0 32 32"><path d="M25 9a12 12 0 1 0 3 10h-5a7 7 0 1 1-2-7l-4 4h12V4Z"/></svg>';document.getElementById('overlay').classList.remove('hidden')}
const input={left:false,right:false,jump:false,dash:false};let running=false,won=false,coins=0,lives=3,last=0,cam=0,world=3100,shake=0;
updateLives();showCard('start');
const player={x:80,y:390,vx:0,vy:0,w:34,h:48,ground:false,face:1,anim:0,jumpHeld:false,dashT:0,inv:0,land:0};
const platforms=[{x:-100,y:462,w:560,h:120},{x:520,y:420,w:210,h:35},{x:805,y:375,w:200,h:35},{x:1085,y:430,w:190,h:35},{x:1350,y:380,w:225,h:35},{x:1660,y:430,w:180,h:35},{x:1900,y:365,w:240,h:35},{x:2215,y:420,w:180,h:35},{x:2475,y:365,w:220,h:35},{x:2775,y:445,w:430,h:120}];
const lift={x:742,y:356,w:118,h:24,baseY:356,prevX:742,prevY:356,phase:0};const winds=[{x:1278,y:255,w:76,h:160,phase:0},{x:1839,y:220,w:62,h:175,phase:1.7},{x:2396,y:235,w:78,h:165,phase:3.1}];
const gems=[560,650,865,940,1140,1210,1410,1500,1710,1980,2070,2540].map((x,i)=>({x,y:[370,345,320,340,375,360,325,330,375,310,300,310][i],got:false,phase:i*.8}));
const enemies=[{x:880,y:342,v:1.1,a:830,b:970,alive:true},{x:1390,y:347,v:1.35,a:1360,b:1550,alive:true},{x:1950,y:332,v:1.2,a:1920,b:2110,alive:true},{x:2500,y:332,v:1.45,a:2490,b:2670,alive:true}];
const clouds=Array.from({length:15},(_,i)=>({x:i*250+Math.random()*120,y:45+Math.random()*210,s:.45+Math.random()*.85}));
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawSky(t){
  const img=worldArt;if(img.complete&&img.naturalWidth){const aspect=W/H,ia=img.naturalWidth/img.naturalHeight;let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;if(ia>aspect){sw=sh*aspect;sx=(img.naturalWidth-sw)*Math.min(.82,Math.max(.08,cam/world*.72));}else{sh=sw/aspect;sy=(img.naturalHeight-sh)*.12;}ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H)}else{ctx.fillStyle='#15243a';ctx.fillRect(0,0,W,H)}
  const veil=ctx.createLinearGradient(0,0,0,H);veil.addColorStop(0,'#101a2b44');veil.addColorStop(.56,'#15243a22');veil.addColorStop(1,'#18263899');ctx.fillStyle=veil;ctx.fillRect(0,0,W,H);
  for(let i=0;i<18;i++){const x=((i*137+Math.sin(t*.7+i)*22-cam*.035)%(W+20)+W+20)%(W+20)-10,y=(i*79+t*(5+i%4))%(H*.72);ctx.globalAlpha=.15+(.2*Math.sin(t*2+i));ctx.fillStyle=i%3?'#d7e8e6':'#ffd79c';ctx.beginPath();ctx.arc(x,y,i%4===0?1.8:1,0,6.28);ctx.fill()}ctx.globalAlpha=1;
}
function drawPlatform(p){const x=p.x-cam;if(x+p.w< -40||x>W+40)return;ctx.save();ctx.shadowColor='#050a16aa';ctx.shadowBlur=22;ctx.shadowOffsetY=10;const h=Math.max(55,p.h);const rock=ctx.createLinearGradient(0,p.y,0,p.y+h);rock.addColorStop(0,'#756b72');rock.addColorStop(.22,'#4e4f5f');rock.addColorStop(.68,'#303b4e');rock.addColorStop(1,'#1c293a');ctx.beginPath();ctx.moveTo(x+8,p.y+4);ctx.quadraticCurveTo(x+p.w*.22,p.y-7,x+p.w*.48,p.y+3);ctx.quadraticCurveTo(x+p.w*.78,p.y-6,x+p.w-8,p.y+4);ctx.lineTo(x+p.w-15,p.y+Math.min(p.h,35));ctx.quadraticCurveTo(x+p.w*.76,p.y+Math.min(p.h,53),x+p.w*.62,p.y+Math.min(p.h,44));ctx.lineTo(x+p.w*.52,p.y+Math.min(p.h,Math.max(44,p.h-5)));ctx.lineTo(x+p.w*.41,p.y+Math.min(p.h,Math.max(38,p.h-16)));ctx.quadraticCurveTo(x+p.w*.22,p.y+Math.min(p.h,44),x+12,p.y+Math.min(p.h,30));ctx.closePath();ctx.fillStyle=rock;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
ctx.beginPath();ctx.moveTo(x+4,p.y+8);ctx.quadraticCurveTo(x+p.w*.24,p.y-2,x+p.w*.48,p.y+6);ctx.quadraticCurveTo(x+p.w*.79,p.y-2,x+p.w-4,p.y+8);ctx.lineTo(x+p.w-10,p.y+16);ctx.quadraticCurveTo(x+p.w*.71,p.y+10,x+p.w*.48,p.y+16);ctx.quadraticCurveTo(x+p.w*.25,p.y+11,x+10,p.y+17);ctx.closePath();const top=ctx.createLinearGradient(0,p.y,0,p.y+20);top.addColorStop(0,'#a99a8f');top.addColorStop(.4,'#827c7d');top.addColorStop(1,'#5d626d');ctx.fillStyle=top;ctx.fill();
ctx.strokeStyle='#d0b89666';ctx.lineWidth=1;for(let j=0;j<3;j++){const yy=p.y+25+j*11;if(yy<p.y+Math.min(p.h,48)){ctx.beginPath();ctx.moveTo(x+14,yy);ctx.quadraticCurveTo(x+p.w*.5,yy+7,x+p.w-18,yy-3);ctx.stroke()}}
ctx.strokeStyle='#d9bb8c77';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x+p.w*.38,p.y+7);ctx.lineTo(x+p.w*.43,p.y+13);ctx.lineTo(x+p.w*.5,p.y+6);ctx.lineTo(x+p.w*.57,p.y+13);ctx.lineTo(x+p.w*.62,p.y+7);ctx.stroke();ctx.fillStyle='#edc887';ctx.globalAlpha=.65;for(const xx of [x+18,x+p.w-18]){ctx.beginPath();ctx.arc(xx,p.y+12,1.7,0,6.28);ctx.fill()}ctx.globalAlpha=1;
if(p.h>65){ctx.strokeStyle='#8ca6b777';ctx.lineWidth=2;for(let i=0;i<4;i++){const rx=x+p.w*(.2+i*.18),len=12+(i%2)*13;ctx.beginPath();ctx.moveTo(rx,p.y+32);ctx.bezierCurveTo(rx-5,p.y+32+len*.4,rx+7,p.y+32+len*.7,rx+2,p.y+32+len);ctx.stroke()}}ctx.restore()}
function drawLift(t){const x=lift.x-cam,y=lift.y;if(x+lift.w<0||x>W)return;ctx.save();ctx.shadowColor='#75ddd9aa';ctx.shadowBlur=18;ctx.fillStyle='#24374a';ctx.beginPath();ctx.roundRect(x,y,lift.w,lift.h,9);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#87d4cdaa';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+1,y+1,lift.w-2,lift.h-2,8);ctx.stroke();ctx.fillStyle='#f1d49b';ctx.beginPath();ctx.arc(x+lift.w/2,y+lift.h/2,3,0,6.28);ctx.fill();ctx.globalAlpha=.5+.25*Math.sin(t*4);ctx.fillStyle='#8be1db';ctx.fillRect(x+15,y+lift.h-2,lift.w-30,2);ctx.restore()}
function drawWinds(t){for(const z of winds){const x=z.x-cam;if(x+z.w<0||x>W)continue;ctx.save();const grd=ctx.createLinearGradient(x,0,x+z.w,0);grd.addColorStop(0,'#79d8d500');grd.addColorStop(.5,'#79d8d522');grd.addColorStop(1,'#79d8d500');ctx.fillStyle=grd;ctx.fillRect(x,z.y,z.w,z.h);ctx.strokeStyle='#a0e7dc77';ctx.lineWidth=2;for(let i=0;i<4;i++){const px=x+14+i*18+Math.sin(t*2+i+z.phase)*7;ctx.beginPath();for(let j=0;j<5;j++){const py=z.y+z.h-j*z.h/4;if(j===0)ctx.moveTo(px,py);else ctx.quadraticCurveTo(px+Math.sin(t*2+j+i)*9,py+8,px+Math.sin(t*2+j+i+1)*3,py)}ctx.stroke()}ctx.restore()}}
function drawTree(x,y,s){ctx.save();ctx.translate(x-cam,y);ctx.scale(s,s);let trunk=ctx.createLinearGradient(-7,0,7,0);trunk.addColorStop(0,'#614b48');trunk.addColorStop(.5,'#a16e50');trunk.addColorStop(1,'#594956');ctx.fillStyle=trunk;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-4,-38);ctx.lineTo(4,-39);ctx.lineTo(7,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#d19c66';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-1,-8);ctx.lineTo(-2,-32);ctx.stroke();for(const [bx,by] of [[-3,-24],[3,-30]]){ctx.strokeStyle='#805941';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,by+8);ctx.lineTo(bx,by);ctx.stroke()}let leaf=ctx.createRadialGradient(-6,-60,2,0,-47,30);leaf.addColorStop(0,'#a6d78a');leaf.addColorStop(.55,'#5eaa79');leaf.addColorStop(1,'#2d766e');ctx.fillStyle=leaf;for(const [a,b,r] of [[0,-50,21],[-16,-41,16],[15,-41,17],[-9,-60,16],[9,-63,17]]){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#d7e6a0';for(const [a,b] of [[-9,-58],[7,-68],[-19,-43],[14,-42]]){ctx.beginPath();ctx.arc(a,b,3,0,6.28);ctx.fill()}ctx.restore()}
function drawLandmarks(){let lx=2850-cam;if(lx>-100&&lx<W+100){let tower=ctx.createLinearGradient(lx,0,lx+20,0);tower.addColorStop(0,'#f9e8bf');tower.addColorStop(.68,'#fff2d2');tower.addColorStop(1,'#d3ad86');ctx.fillStyle=tower;ctx.beginPath();ctx.moveTo(lx-2,294);ctx.lineTo(lx+2,278);ctx.lineTo(lx+9,278);ctx.lineTo(lx+15,294);ctx.lineTo(lx+18,437);ctx.lineTo(lx-7,437);ctx.closePath();ctx.fill();ctx.fillStyle='#c87b5b';ctx.fillRect(lx-10,291,31,6);ctx.fillRect(lx-8,340,25,4);ctx.fillRect(lx-8,391,25,4);let light=ctx.createRadialGradient(lx+6,316,2,lx+6,316,65);light.addColorStop(0,'#fff8ccaa');light.addColorStop(1,'#ffe47800');ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(lx+4,310);ctx.lineTo(lx-72,265);ctx.lineTo(lx+78,265);ctx.closePath();ctx.fill();ctx.fillStyle='#ffc85f';ctx.beginPath();ctx.arc(lx+6,315,8,0,6.28);ctx.fill();ctx.fillStyle='#fff8cc';ctx.beginPath();ctx.arc(lx+6,315,3,0,6.28);ctx.fill();ctx.fillStyle='#b9604e';ctx.beginPath();ctx.moveTo(lx-15,291);ctx.lineTo(lx+6,258);ctx.lineTo(lx+27,291);ctx.closePath();ctx.fill();ctx.fillStyle='#f4dfb6';ctx.beginPath();ctx.arc(lx+6,258,4,Math.PI,0);ctx.fill();ctx.fillStyle='#72524d';ctx.fillRect(lx-4,407,16,30);ctx.fillStyle='#fff1c8';ctx.fillRect(lx+1,412,5,9)}}
function drawGem(g,t){if(g.got)return;let x=g.x-cam,y=g.y+Math.sin(t*3+g.phase)*5;ctx.save();ctx.translate(x,y);ctx.rotate(t*.65+g.phase);ctx.shadowColor='#ffdf63';ctx.shadowBlur=15;ctx.fillStyle='#ffda62';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,-2);ctx.lineTo(5,9);ctx.lineTo(-5,9);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff2a8';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,-2);ctx.lineTo(0,1);ctx.closePath();ctx.fill();ctx.restore()}
function drawEnemy(e,t){if(!e.alive)return;let x=e.x-cam,y=e.y+Math.sin(t*7+e.x)*2;ctx.save();ctx.translate(x,y);ctx.fillStyle='#486d77';ctx.beginPath();ctx.ellipse(0,6,19,14,0,0,6.28);ctx.fill();ctx.fillStyle='#6fa3a0';ctx.beginPath();ctx.ellipse(-3,0,14,10,0,0,6.28);ctx.fill();ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(5,-3,4,0,6.28);ctx.fill();ctx.fillStyle='#294556';ctx.beginPath();ctx.arc(6,-3,1.7,0,6.28);ctx.fill();ctx.strokeStyle='#35565c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,16);ctx.lineTo(-13,19);ctx.moveTo(10,16);ctx.lineTo(14,19);ctx.stroke();ctx.restore()}
function drawHero(t){const x=player.x-cam+player.w/2,y=player.y+player.h;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);if(player.dashT>0){ctx.globalAlpha=.38;for(let i=0;i<4;i++){ctx.strokeStyle=i%2?'#f2d5a2':'#82d8d2';ctx.lineWidth=2+i%2;ctx.beginPath();ctx.moveTo(-24-i*6,-22-i*5);ctx.lineTo(-44-i*8,-22-i*5);ctx.stroke()}ctx.globalAlpha=1}if(player.inv>0&&Math.floor(t*14)%2===0)ctx.globalAlpha=.48;const moving=player.ground&&Math.abs(player.vx)>20;const bob=player.ground?(moving?Math.abs(Math.sin(player.anim*13))*2:Math.sin(t*2)*1):Math.sin(t*8)*2;const scaleX=player.dashT>0?1.08:1,scaleY=player.vy< -120?1.04:player.vy>180?.94:1;ctx.fillStyle='#070f1e66';ctx.beginPath();ctx.ellipse(0,1,player.ground?22:14,4,0,0,6.28);ctx.fill();ctx.translate(0,-bob);ctx.scale(scaleX,scaleY);if(courierArt.complete&&courierArt.naturalWidth)ctx.drawImage(courierArt,-34,-65,68,68);else{ctx.fillStyle='#e98652';ctx.beginPath();ctx.ellipse(0,-28,13,24,0,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(-11,-47);ctx.lineTo(-10,-64);ctx.lineTo(-2,-49);ctx.fill();ctx.beginPath();ctx.moveTo(3,-49);ctx.lineTo(13,-61);ctx.lineTo(11,-43);ctx.fill()}ctx.restore()}
function draw(t){drawSky(t);drawWinds(t);drawLandmarks();platforms.forEach(drawPlatform);drawLift(t);gems.forEach(g=>drawGem(g,t));enemies.forEach(e=>drawEnemy(e,t));drawHero(t);if(shake>0){shake*=.88}}
function update(dt,t){if(!running)return;dt=Math.min(dt,.035);const accel=player.ground?1500:970,max=250;let dir=(input.right?1:0)-(input.left?1:0);if(dir){player.vx+=dir*accel*dt;player.vx=Math.max(-max,Math.min(max,player.vx));player.face=dir}else player.vx*=Math.pow(player.ground?.0005:.16,dt);if(Math.abs(player.vx)<4)player.vx=0;
if(input.dash&&player.dashT<=0){player.dashT=.22;player.vx=player.face*520;player.vy=Math.min(player.vy,40)}if(player.dashT>0)player.dashT-=dt;
lift.prevX=lift.x;lift.prevY=lift.y;lift.x=742+Math.sin(t*.72)*28;lift.y=356+Math.sin(t*1.35)*68;if(player.platform===lift){player.x+=lift.x-lift.prevX;player.y+=lift.y-lift.prevY}
if(input.jump&&!player.jumpHeld&&player.ground){player.vy=-510;player.ground=false;player.land=0}if(input.jump&&player.vy<0)player.vy-=720*dt;player.jumpHeld=input.jump;player.vy+=1250*dt;player.vy=Math.min(player.vy,760);let oldY=player.y;player.platform=null;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(world-player.w,player.x));player.y+=player.vy*dt;player.ground=false;
for(const p of [...platforms,lift]){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+9&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;player.platform=p}}
for(const z of winds){if(player.x+player.w>z.x&&player.x<z.x+z.w&&player.y+player.h>z.y&&player.y<z.y+z.h){player.vy-=1050*dt;player.vx+=Math.sign((z.x+z.w/2)-(player.x+player.w/2))*40*dt;player.vy=Math.max(-480,player.vy)}}
if(player.y>610){lives--;updateLives();player.x=Math.max(40,player.x-220);player.y=330;player.vx=player.vy=0;player.inv=1.2;if(lives<=0){running=false;showCard('fail')}}
player.anim+=dt;if(player.inv>0)player.inv-=dt;if(player.ground&&oldY<player.y)player.land=.12;player.land=Math.max(0,player.land-dt);cam=Math.max(0,Math.min(world-W,player.x-W*.34));
for(const g of gems)if(!g.got&&Math.hypot((player.x+17)-g.x,(player.y+22)-g.y)<27){g.got=true;coins++;document.getElementById('coins').textContent=coins+'/12'}
for(const e of enemies){if(!e.alive)continue;e.x+=e.v*65*dt;if(e.x<e.a||e.x>e.b)e.v*=-1;if(player.x+player.w>e.x-16&&player.x<e.x+16&&player.y+player.h>e.y-9&&player.y<e.y+20){if(player.vy>120&&player.y+player.h<e.y+12){e.alive=false;player.vy=-300}else if(player.inv<=0){lives--;updateLives();player.inv=1.2;player.vx=-player.face*210;player.vy=-260;if(lives<=0){running=false;showCard('fail')}}}}
if(player.x>world-260&&!won){won=true;running=false;showCard('win',true)}}
function reset(){coins=0;lives=3;won=false;cam=0;player.x=80;player.y=390;player.vx=player.vy=0;player.platform=null;lift.x=742;lift.y=lift.baseY;lift.prevX=lift.x;lift.prevY=lift.y;player.inv=0;gems.forEach(g=>g.got=false);enemies.forEach((e,i)=>{e.alive=true;e.x=[880,1390,1950,2500][i]});document.getElementById('coins').textContent='0/12';updateLives();document.getElementById('overlay').classList.add('hidden');running=true}
function frame(ms){let t=ms/1000,dt=Math.min(.04,(ms-last)/1000||0);last=ms;update(dt,t);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
async function enterFullscreen(){const root=document.documentElement;try{if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'})}catch{}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}}
document.getElementById('start').addEventListener('click',()=>{reset();enterFullscreen()});document.querySelector('.rotateNotice').addEventListener('pointerdown',()=>enterFullscreen());
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'dash',KeyX:'dash'};window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=true}});window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=false}});
document.querySelectorAll('.ctrl').forEach(b=>{let key=b.dataset.key;const on=e=>{e.preventDefault();input[key]=true;b.classList.add('down')},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
})();
</script></body></html>
