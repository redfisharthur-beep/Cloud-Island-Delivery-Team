function drawRiftGate(t){const x=portal.x-cam,y=portal.y-54;if(x< -120||x>W+120)return;ctx.save();ctx.translate(x,y);const pulse=.5+.5*Math.sin(t*2.1);ctx.globalAlpha=.26;let aura=ctx.createRadialGradient(0,0,8,0,0,75);aura.addColorStop(0,dungeonActive?'#b38cff44':'#86e9dd44');aura.addColorStop(1,'#9ce9dc00');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,0,75,0,6.28);ctx.fill();ctx.save();ctx.rotate(-t*.42);ctx.shadowColor=dungeonActive?'#d0a6ff':'#a7f3e7';ctx.shadowBlur=18;ctx.strokeStyle=dungeonActive?'#d6b5ff':'#b9f4e5';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,35,17,-.1,0,6.28);ctx.stroke();ctx.strokeStyle='#ffe2aa';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,42,20,-.1,.1,3.8);ctx.stroke();ctx.restore();const core=ctx.createRadialGradient(-4,-3,1,0,0,25);core.addColorStop(0,'#01030a');core.addColorStop(.72,'#030712');core.addColorStop(.9,dungeonActive?'#b28dff':'#8ee8dc');core.addColorStop(1,'#ffffff00');ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,26,0,6.28);ctx.fill();ctx.fillStyle='#01030a';ctx.beginPath();ctx.arc(0,0,15,0,6.28);ctx.fill();ctx.globalAlpha=.65;ctx.strokeStyle='#f3e2c0';ctx.lineWidth=1;for(let i=0;i<4;i++){const a=t*-.9+i*1.57;ctx.beginPath();ctx.arc(0,0,31+i*3,a,a+1.15);ctx.stroke()}ctx.globalAlpha=.85;ctx.shadowColor='#fff3d7';ctx.shadowBlur=9;ctx.fillStyle='#fff0cf';ctx.beginPath();ctx.arc(0,0,1.4+2*pulse,0,6.28);ctx.fill();ctx.restore()}
function drawDungeonArena(t){if(!dungeonActive)return;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#100c25aa');g.addColorStop(.55,'#130e2b66');g.addColorStop(1,'#160e27bb');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++){const x=(i*178-(t*18)%178);ctx.save();ctx.globalAlpha=.3;ctx.fillStyle=i%2?'#795fa1':'#4e8c94';ctx.beginPath();ctx.moveTo(x,462);ctx.lineTo(x+20,300+(i%3)*22);ctx.lineTo(x+37,462);ctx.fill();ctx.strokeStyle='#c9a5ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+20,300+(i%3)*22);ctx.lineTo(x+20,462);ctx.stroke();ctx.restore()}ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#c29aff';ctx.shadowColor='#ad7aff';ctx.shadowBlur=14;for(let i=0;i<6;i++){const x=i*190-cam*.08+((t*5)%190);ctx.beginPath();ctx.arc(x,180+Math.sin(t+i)*14,2,0,6.28);ctx.stroke()}ctx.restore();if(dungeonClear){const x=790-cam,y=421;ctx.save();ctx.translate(x,y+Math.sin(t*2)*2);ctx.shadowColor='#d7b2ff';ctx.shadowBlur=24;ctx.fillStyle='#372a4b';ctx.strokeStyle='#e1c8ff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-27,-23,54,36,5);ctx.fill();ctx.stroke();ctx.fillStyle='#b88ce6';ctx.fillRect(-30,-25,60,8);ctx.fillStyle='#ffe4a0';ctx.beginPath();ctx.arc(0,-7,6,0,6.28);ctx.fill();ctx.restore()}}
function bossHit(dmg,source){if(!boss||bossDefeated)return;const hitX=boss.x,hitY=boss.y;boss.hp=Math.max(0,boss.hp-dmg);boss.state='stagger';boss.timer=.7;bossStatus='';shake=8;burst(hitX,hitY-24,source==='ritual'?'#a8f3e2':'#ffd181',20);effects.push({type:'ring',x:hitX,y:hitY-25,life:.7,max:.7,color:source==='ritual'?'#a8f3e2':'#ffd181'});if(boss.hp<=0){bossDefeated=true;boss=null;bossStatus='';burst(hitX,hitY-24,'#ffe29b',42);effects.push({type:'beam',x:hitX,y:hitY,color:'#ffe29b',life:1.6,max:1.6})}updateBossUI()}
function updateRitualProgress(){if(!boss||bossDefeated||!boss.awake)return;let padIndex=-1;for(let i=0;i<ritualPads.length;i++){const pad=ritualPads[i];if(player.ground&&Math.abs(player.x+player.w/2-pad.x)<18&&Math.abs(player.y+player.h-pad.y)<14){padIndex=i;break}}if(padIndex<0){player.lastRitualPad=-1;return}if(padIndex===player.lastRitualPad)return;player.lastRitualPad=padIndex;if(padIndex===ritualProgress){const pad=ritualPads[padIndex];ritualProgress++;updateRitualUI();effects.push({type:'beam',x:pad.x,y:pad.y,color:'#9ce9dc',life:.7,max:.7});bossHit(1,'ritual')}else{ritualProgress=0;updateRitualUI();const pad=ritualPads[padIndex];burst(pad.x,pad.y,'#f2a1a0',8)}}
function updateBoss(dt,t){if(!boss||bossDefeated||!boss.awake)return;boss.timer-=dt;const dx=(player.x+player.w/2)-boss.x;if(boss.state==='patrol'){boss.x+=Math.sin(t*1.2+stage)*42*dt;boss.face=Math.sign(dx)||boss.face;if(Math.abs(dx)<370&&boss.timer<=0){boss.state='windup';boss.timer=.9;boss.attackDir=Math.sign(dx)||1;boss.phase++}}else if(boss.state==='windup'){boss.face=boss.attackDir;if(boss.timer<=0){if(boss.phase%2===1){boss.state='volley';boss.timer=.72;shootBossVolley()}else{boss.state='lunge';boss.timer=.58;boss.didHit=false;boss.attackDir=Math.sign(dx)||boss.attackDir}}}else if(boss.state==='volley'){if(boss.timer<=0){boss.state='recover';boss.timer=1.05}}else if(boss.state==='lunge'){boss.x+=boss.attackDir*(580+stage*45)*dt;if(!boss.didHit&&Math.abs((player.x+17)-boss.x)<76){boss.didHit=true;damagePlayer(boss.x);if(stage===2){player.vx*=.55;bossStatus='slow';setTimeout(()=>{bossStatus='';updateStatus()},1700)}if(stage===3){bossStatus='poison';player.poisonT=3.2;updateStatus()}}if(boss.timer<=0){boss.state='recover';boss.timer=1.2}}else if(boss.state==='recover'||boss.state==='stagger'){if(boss.timer<=0){boss.state='patrol';boss.timer=stage===3?1.6:1.25}}boss.x=Math.max(world-610,Math.min(stage===1?world-405:world-275,boss.x));}
function drawBoss(t){if(!boss||bossDefeated||!boss.awake)return;const x=boss.x-cam,y=boss.y+Math.sin(t*2.1+stage)*3,wind=boss.state==='windup'?Math.max(0,1-boss.timer/.9):0,lunge=boss.state==='lunge'?Math.sin((1-boss.timer/.58)*Math.PI):0,art=bossArts[stage-1],glow=stage===1?'#ffb45c':stage===2?'#67e5ee':'#d998ff';ctx.save();ctx.translate(x,y);ctx.scale(boss.face>0?-1:1,1);ctx.rotate(-wind*.055+lunge*.035);ctx.scale(1+lunge*.13+wind*.025,1-lunge*.06+wind*.035);ctx.save();ctx.globalAlpha=.42;ctx.fillStyle='#0b1420';ctx.beginPath();ctx.ellipse(0,1,67,12,0,0,6.28);ctx.fill();ctx.restore();ctx.shadowColor=glow;ctx.shadowBlur=wind?34:20;if(art.complete&&art.naturalWidth)ctx.drawImage(art,-142,-176,284,176);else if(biterArt.complete&&biterArt.naturalWidth)ctx.drawImage(biterArt,-125,-150,250,150);else{ctx.fillStyle='#384657';ctx.beginPath();ctx.ellipse(0,-70,66,62,0,0,6.28);ctx.fill();ctx.fillStyle=glow;ctx.beginPath();ctx.arc(-35,-100,8,0,6.28);ctx.fill()}ctx.shadowBlur=0;if(wind){ctx.globalAlpha=.75;ctx.strokeStyle=glow;ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,-84,84+i*12+Math.sin(t*15+i)*3,Math.PI,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}if(lunge){ctx.globalAlpha=.58;ctx.strokeStyle=glow;ctx.lineWidth=4;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-70-i*12,-42+i*16);ctx.lineTo(-132-i*14,-42+i*16);ctx.stroke()}ctx.globalAlpha=1}if(boss.state==='recover'){ctx.globalAlpha=.8;ctx.fillStyle='#ffe3a0';for(let i=0;i<3;i++){const a=t*2+i*2.1;ctx.beginPath();ctx.arc(Math.cos(a)*82,-105+Math.sin(a)*18,3,0,6.28);ctx.fill()}}ctx.restore()}
function advanceStage(){if(stage>=3){won=true;running=false;showCard('win',true);return}scoreTotal+=coins;loadStage(stage+1);checkpointX=80;checkpointY=462-player.h;player.x=80;player.y=462-player.h;player.vx=player.vy=0;player.ground=false;player.platform=null;player.inv=1.4;player.airJumpUsed=false;player.lastRitualPad=-1;cam=Math.max(-W*.5,player.x+player.w/2-W*.5);stageFlash=2;effects.push({type:'ring',x:W*.5,y:H*.4,life:1.2,max:1.2,color:'#e8d19c'})}
function update(dt,t){if(!running)return;dt=Math.min(dt,.035);const empowered=powerType==='star',accel=player.ground?1500:970,max=empowered?325:250;let dir=(input.right?1:0)-(input.left?1:0);player.crouch=!!(input.down&&player.ground);if(dir){player.vx+=dir*accel*dt;player.vx=Math.max(-max,Math.min(max,player.vx));player.face=dir}else player.vx*=Math.pow(player.ground?.0005:.16,dt);if(player.crouch){player.vx*=.86;player.vx=Math.max(-92,Math.min(92,player.vx))}if(bossStatus==='slow')player.vx*=Math.pow(.42,dt);if(Math.abs(player.vx)<4)player.vx=0;
if(input.dash&&player.dashT<=0){player.dashT=empowered?.34:.22;player.vx=player.face*(empowered?650:520);player.vy=Math.min(player.vy,40)}if(player.dashT>0)player.dashT-=dt;
lift.prevX=lift.x;lift.prevY=lift.y;lift.x=lift.baseX+Math.sin(t*.72+stage)*lift.rangeX;lift.y=lift.baseY+Math.sin(t*1.35+stage)*lift.rangeY;if(player.platform===lift){player.x+=lift.x-lift.prevX;player.y+=lift.y-lift.prevY}
if(input.jump&&!player.jumpHeld){if(player.ground){player.vy=-510;player.ground=false;player.airJumpUsed=false;player.land=0}else if(powerType==='wing'&&!player.airJumpUsed){player.vy=-465;player.airJumpUsed=true;burst(player.x+17,player.y+player.h,'#9be8e2',10)}}if(input.jump&&player.vy<0)player.vy-=720*dt;player.jumpHeld=input.jump;const glide=powerType==='wing'&&input.jump&&player.vy>0;player.vy+=(glide?340:1250)*dt;player.vy=Math.min(player.vy,glide?250:760);let oldY=player.y;player.platform=null;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(world-player.w,player.x));player.y+=player.vy*dt;player.ground=false;
for(const p of [...platforms,lift]){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+9&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;player.platform=p;player.airJumpUsed=false;if(p!==lift&&player.x>checkpointX+420){checkpointX=player.x;checkpointY=player.y}}}
for(const z of winds){if(player.x+player.w>z.x&&player.x<z.x+z.w&&player.y+player.h>z.y&&player.y<z.y+z.h){player.vy-=1050*dt;player.vx+=Math.sign((z.x+z.w/2)-(player.x+player.w/2))*40*dt;player.vy=Math.max(-480,player.vy)}}
if(player.y>610){if(powerType==='star'){player.y=335;player.vy=-160;player.inv=.75}else{lives--;updateLives();player.x=checkpointX;player.y=checkpointY;player.vx=player.vy=0;player.inv=1.2;player.platform=null;if(lives<=0){running=false;showCard('fail')}}}
player.anim+=dt;if(player.inv>0&&powerType!=='star')player.inv-=dt;if(powerType&&powerTimer>0){powerTimer-=dt;if(powerTimer<=0){powerTimer=0;powerType='';updatePowerUI();updateStatus()}else document.getElementById('powerFill').style.width=`${Math.max(0,powerTimer/(powerType==='star'?8:10)*100)}%`}if(player.ground&&oldY<player.y)player.land=.12;player.land=Math.max(0,player.land-dt);cam=Math.max(-W*.5,Math.min(world-W,player.x+player.w/2-W*.5));stageFlash=Math.max(0,stageFlash-dt);
for(const g of gems)if(!g.got&&Math.hypot((player.x+17)-g.x,(player.y+22)-g.y)<29){g.got=true;coins++;document.getElementById('coins').textContent=coins+'/'+gemTotal;burst(g.x,g.y,'#ffe17b',14);effects.push({type:'ring',x:g.x,y:g.y,life:.62,max:.62,color:'#ffe7a0'})}for(const it of items)if(!it.got&&Math.hypot((player.x+17)-it.x,(player.y+22)-it.y)<30)collectItem(it);
for(const e of enemies)updateEnemy(e,dt,t);if(boss&&!boss.awake&&player.x>world-900){boss.awake=true;stageFlash=.85;updateBossUI();effects.push({type:'beam',x:boss.x,y:boss.y,color:'#ffbf83',life:1.15,max:1.15})}updateBoss(dt,t);updateProjectiles(dt);updateRitualProgress();if(dungeonActive&&!dungeonClear&&enemies.length&&enemies.every(e=>!e.alive)){if(dungeonWave<3){dungeonWave++;enemies=makeDungeonWave(dungeonWave);effects.push({type:'beam',x:500,y:462,color:'#c7a1ff',life:1,max:1})}else{dungeonClear=true;dungeonChest=true;effects.push({type:'beam',x:790,y:462,color:'#dfc2ff',life:1.7,max:1.7})}updateDungeonHud()}if(dungeonActive&&dungeonClear&&dungeonChest&&player.x+player.w>755&&player.x<830&&player.y+player.h>390){dungeonChest=false;running=false;showCard('reward')}if(player.poisonT>0){player.poisonT-=dt;updateStatus();player.poisonClock=(player.poisonClock||0)-dt;if(player.poisonClock<=0){player.poisonClock=.8;damagePlayer(player.x+player.face*50);burst(player.x+17,player.y+20,'#ae8cd2',7)}}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.type==='spark'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=290*dt;e.vx*=Math.pow(.12,dt)}if(e.life<=0)effects.splice(i,1)}
updatePortalPrompt();if(!dungeonActive&&player.x>world-260&&!won&&bossDefeated)advanceStage()}
function reset(){dungeonActive=false;dungeonSave=null;dungeonWave=0;dungeonClear=false;dungeonChest=false;document.getElementById('miniWorldHud').classList.add('hidden');stage=1;coins=0;scoreTotal=0;lives=3;won=false;cam=Math.max(-W*.5,80+player.w/2-W*.5);checkpointX=80;checkpointY=462-player.h;stageFlash=0;effects.length=0;powerType='';powerTimer=0;shields=0;attackStock=4;healStock=0;player.poisonT=0;player.lastRitualPad=-1;loadStage(1);player.x=80;player.y=462-player.h;player.vx=player.vy=0;player.platform=null;player.ground=false;player.jumpHeld=false;player.airJumpUsed=false;player.inv=0;player.dashT=0;document.getElementById('coins').textContent='0/'+gemTotal;updatePowerUI();updateLives();updateStatus();document.getElementById('overlay').classList.add('hidden');running=true}
function frame(ms){let t=ms/1000,dt=Math.min(.04,(ms-last)/1000||0);last=ms;update(dt,t);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
async function enterFullscreen(){const root=document.documentElement;try{if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'})}catch{}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}}
document.getElementById('start').addEventListener('click',()=>{const mode=document.querySelector('.menuCard').dataset.mode;if(mode==='reward'){returnFromDungeon();return}reset();enterFullscreen()});document.getElementById('portalBtn').addEventListener('click',enterDungeon);document.querySelector('.rotateNotice').addEventListener('pointerdown',()=>enterFullscreen());
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowUp:'jump',KeyW:'jump',Space:'jump'};window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=true}if(e.repeat)return;if(e.code==='KeyP')input.dash=true;if(e.code==='KeyO')useAttack();if(e.code==='KeyL')useHeal()});window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=false}if(e.code==='KeyP')input.dash=false});
const joy=document.getElementById('joystick'),knob=document.getElementById('joyKnob');let joyPointer=null;function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.31,len=Math.hypot(dx,dy)||1,k=Math.min(1,lim/len),nx=dx*k,ny=dy*k;knob.style.transform=`translate(${nx}px,${ny}px)`;input.left=nx< -lim*.22;input.right=nx>lim*.22;input.down=ny>lim*.35;input.jump=ny< -lim*.34}function releaseJoy(){joyPointer=null;knob.style.transform='';input.left=input.right=input.down=input.jump=false}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,releaseJoy));document.querySelectorAll('.ctrl').forEach(b=>{const key=b.dataset.key;const on=e=>{e.preventDefault();if(key==='attack')useAttack();else if(key==='heal')useHeal();else input[key]=true;b.classList.add('down')},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
})();
