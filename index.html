function drawLift(t){const x=lift.x-cam,y=lift.y;if(x+lift.w<0||x>W)return;ctx.save();ctx.shadowColor='#75ddd9aa';ctx.shadowBlur=18;ctx.fillStyle='#24374a';ctx.beginPath();ctx.roundRect(x,y,lift.w,lift.h,9);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#87d4cdaa';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+1,y+1,lift.w-2,lift.h-2,8);ctx.stroke();ctx.fillStyle='#f1d49b';ctx.beginPath();ctx.arc(x+lift.w/2,y+lift.h/2,3,0,6.28);ctx.fill();ctx.globalAlpha=.5+.25*Math.sin(t*4);ctx.fillStyle='#8be1db';ctx.fillRect(x+15,y+lift.h-2,lift.w-30,2);ctx.restore()}
function drawWinds(t){for(const z of winds){const x=z.x-cam;if(x+z.w<0||x>W)continue;ctx.save();const grd=ctx.createLinearGradient(x,0,x+z.w,0);grd.addColorStop(0,'#79d8d500');grd.addColorStop(.5,'#79d8d522');grd.addColorStop(1,'#79d8d500');ctx.fillStyle=grd;ctx.fillRect(x,z.y,z.w,z.h);ctx.strokeStyle='#a0e7dc77';ctx.lineWidth=2;for(let i=0;i<4;i++){const px=x+14+i*18+Math.sin(t*2+i+z.phase)*7;ctx.beginPath();for(let j=0;j<5;j++){const py=z.y+z.h-j*z.h/4;if(j===0)ctx.moveTo(px,py);else ctx.quadraticCurveTo(px+Math.sin(t*2+j+i)*9,py+8,px+Math.sin(t*2+j+i+1)*3,py)}ctx.stroke()}ctx.restore()}}
function drawLandmarks(){let lx=2850-cam;if(lx>-100&&lx<W+100){let tower=ctx.createLinearGradient(lx,0,lx+20,0);tower.addColorStop(0,'#f9e8bf');tower.addColorStop(.68,'#fff2d2');tower.addColorStop(1,'#d3ad86');ctx.fillStyle=tower;ctx.beginPath();ctx.moveTo(lx-2,294);ctx.lineTo(lx+2,278);ctx.lineTo(lx+9,278);ctx.lineTo(lx+15,294);ctx.lineTo(lx+18,437);ctx.lineTo(lx-7,437);ctx.closePath();ctx.fill();ctx.fillStyle='#c87b5b';ctx.fillRect(lx-10,291,31,6);ctx.fillRect(lx-8,340,25,4);ctx.fillRect(lx-8,391,25,4);let light=ctx.createRadialGradient(lx+6,316,2,lx+6,316,65);light.addColorStop(0,'#fff8ccaa');light.addColorStop(1,'#ffe47800');ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(lx+4,310);ctx.lineTo(lx-72,265);ctx.lineTo(lx+78,265);ctx.closePath();ctx.fill();ctx.fillStyle='#ffc85f';ctx.beginPath();ctx.arc(lx+6,315,8,0,6.28);ctx.fill();ctx.fillStyle='#fff8cc';ctx.beginPath();ctx.arc(lx+6,315,3,0,6.28);ctx.fill();ctx.fillStyle='#b9604e';ctx.beginPath();ctx.moveTo(lx-15,291);ctx.lineTo(lx+6,258);ctx.lineTo(lx+27,291);ctx.closePath();ctx.fill();ctx.fillStyle='#f4dfb6';ctx.beginPath();ctx.arc(lx+6,258,4,Math.PI,0);ctx.fill();ctx.fillStyle='#72524d';ctx.fillRect(lx-4,407,16,30);ctx.fillStyle='#fff1c8';ctx.fillRect(lx+1,412,5,9)}}
function drawGem(g,t){if(g.got)return;let x=g.x-cam,y=g.y+Math.sin(t*3+g.phase)*5;ctx.save();ctx.translate(x,y);ctx.rotate(t*.65+g.phase);ctx.shadowColor='#ffdf63';ctx.shadowBlur=15;ctx.fillStyle='#ffda62';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,-2);ctx.lineTo(5,9);ctx.lineTo(-5,9);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff2a8';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,-2);ctx.lineTo(0,1);ctx.closePath();ctx.fill();ctx.restore()}
function drawEnemy(e,t){if(!e.alive)return;const x=e.x-cam,y=e.y+Math.sin(t*6+e.x)*3;ctx.save();ctx.translate(x,y);const facing=e.state==='bite'?e.attackDir:e.face||1;ctx.scale(facing,1);let sx=e.state==='windup'?.87:e.state==='bite'?1.2:1,sy=e.state==='windup'?1.08:e.state==='bite'?.82:.92+Math.sin(t*13+e.x)*.09;ctx.scale(sx,sy);if(biterArt.complete&&biterArt.naturalWidth)ctx.drawImage(biterArt,-48,-49,96,68);else{ctx.fillStyle='#344056';ctx.beginPath();ctx.ellipse(0,-12,31,20,0,0,6.28);ctx.fill();ctx.fillStyle='#80e6e2';ctx.beginPath();ctx.arc(15,-18,4,0,6.28);ctx.fill()}if(e.state==='windup'){ctx.globalAlpha=.8;ctx.strokeStyle='#80ded8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-24,34+Math.sin(t*18)*4,Math.PI,Math.PI*2);ctx.stroke()}if(e.state==='bite'){ctx.strokeStyle='#b6fff0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(23,-12);ctx.lineTo(47,-7);ctx.lineTo(27,-1);ctx.stroke();ctx.fillStyle='#fff1d6';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(25+i*6,-11);ctx.lineTo(29+i*6,-7);ctx.lineTo(25+i*6,-6);ctx.fill()}}ctx.restore()}
function drawHero(t){const x=player.x-cam+player.w/2,y=player.y+player.h;ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);const moving=player.ground&&Math.abs(player.vx)>24;let frame=0,row=0;if(!player.ground){row=1;frame=player.vy< -260?0:player.vy< -80?1:player.vy<130?2:3}else if(moving)frame=Math.floor(player.anim*13)%4;const dw=78,dh=78;if(player.inv>0&&Math.floor(t*16)%2===0&&powerType!=='star')ctx.globalAlpha=.45;if(powerType==='star'){ctx.save();ctx.globalAlpha=.44+.2*Math.sin(t*16);ctx.strokeStyle='#f9d77b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-36,38+Math.sin(t*10)*3,42,0,0,6.28);ctx.stroke();ctx.restore();ctx.shadowColor='#f5c85e';ctx.shadowBlur=24;ctx.rotate(Math.sin(t*7)*.025);if(astralArt.complete&&astralArt.naturalWidth)ctx.drawImage(astralArt,-43,-78,86,78);else if(actionArt.complete&&actionArt.naturalWidth)ctx.drawImage(actionArt,0,320,320,320,-39,-76,dw,dh)}else if(actionArt.complete&&actionArt.naturalWidth){ctx.drawImage(actionArt,frame*320,row*320,320,320,-39,-76,dw,dh)}else if(courierArt.complete&&courierArt.naturalWidth){const bob=moving?Math.abs(Math.sin(player.anim*13))*2:Math.sin(t*2);ctx.translate(0,-bob);ctx.drawImage(courierArt,-35,-72,70,72)}else{ctx.fillStyle='#e98652';ctx.beginPath();ctx.ellipse(0,-34,15,26,0,0,6.28);ctx.fill()}if(player.dashT>0){ctx.globalAlpha=.65;for(let i=0;i<5;i++){ctx.strokeStyle=i%2?'#ffe0a1':'#80e4db';ctx.lineWidth=2+i%2;ctx.beginPath();ctx.moveTo(-26-i*5,-29-i*4);ctx.lineTo(-48-i*8,-29-i*4);ctx.stroke()}}if(powerType==='shield'){ctx.globalAlpha=.7+.15*Math.sin(t*9);ctx.strokeStyle='#9be8e2';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-38,43,46,0,0,6.28);ctx.stroke()}ctx.restore()}
function starPath(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r,px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}
function drawItem(it,t){if(it.got)return;const x=it.x-cam,y=it.y+Math.sin(t*3+it.phase)*5,col=it.type==='star'?'#ffd77a':it.type==='wing'?'#8fe3de':it.type==='heart'?'#f39c8d':'#b8d7ec';ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*1.7+it.phase)*.12);ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle='#17273bcc';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,15+Math.sin(t*4+it.phase)*1.5,0,6.28);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2.4;if(it.type==='star'){starPath(0,0,9);ctx.fill()}else if(it.type==='heart'){ctx.beginPath();ctx.moveTo(0,9);ctx.bezierCurveTo(-15,0,-8,-11,0,-4);ctx.bezierCurveTo(8,-11,15,0,0,9);ctx.fill()}else if(it.type==='shield'){ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(8,-5);ctx.lineTo(6,4);ctx.lineTo(0,10);ctx.lineTo(-6,4);ctx.lineTo(-8,-5);ctx.closePath();ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-9,-4);ctx.quadraticCurveTo(-2,-10,0,-1);ctx.quadraticCurveTo(2,-10,9,-4);ctx.moveTo(-8,4);ctx.quadraticCurveTo(-2,-1,0,7);ctx.quadraticCurveTo(2,-1,8,4);ctx.stroke()}ctx.restore()}
function burst(x,y,color,count=12,type='spark'){for(let i=0;i<count;i++){const a=Math.PI*2*i/count+(Math.random()-.5)*.3,s=55+Math.random()*145;effects.push({type,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.55+Math.random()*.35,max:.9,size:2+Math.random()*3,color})}}
function drawEffects(t){for(const e of effects){const q=Math.max(0,e.life/(e.max||.9));ctx.save();ctx.globalAlpha=q;if(e.type==='ring'){ctx.strokeStyle=e.color;ctx.lineWidth=3*q;ctx.shadowColor=e.color;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(e.x-cam,e.y,(1-q)*70+8,0,6.28);ctx.stroke()}else{ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=e.type==='spark'?8:12;starPath(e.x-cam,e.y,e.size*(.5+q));ctx.fill()}ctx.restore()}}
function powerIconSvg(type){return type==='star'?'<svg viewBox="0 0 24 24"><path d="m12 2 2.8 6.3 6.8.6-5.2 4.4 1.6 6.6-6-3.5-6 3.5 1.6-6.6-5.2-4.4 6.8-.6Z" fill="#f8d77b"/></svg>':type==='wing'?'<svg viewBox="0 0 24 24"><path d="M3 8c5-5 8-2 9 4 1-6 4-9 9-4-2 7-6 10-9 11C9 17 5 14 3 8Z" fill="none" stroke="#91e4de" stroke-width="2"/></svg>':'<svg viewBox="0 0 24 24"><path d="M12 2 20 6v6c0 5-4 8-8 10-4-2-8-5-8-10V6Z" fill="none" stroke="#bdd7eb" stroke-width="2"/><path d="m8 12 3 3 5-6" fill="none" stroke="#bdd7eb" stroke-width="2"/></svg>'}
function updatePowerUI(){const el=document.getElementById('powerHud');if(!powerType){el.classList.add('hidden');return}el.classList.remove('hidden');document.getElementById('powerIcon').innerHTML=powerIconSvg(powerType);document.getElementById('powerFill').style.width=powerType==='shield'?'100%':`${Math.max(0,powerTimer/(powerType==='star'?8:10)*100)}%`}
function drawStageFlash(t){if(stageFlash<=0)return;const a=Math.min(1,stageFlash*1.7);ctx.save();ctx.globalAlpha=a;const x=W/2,y=H*.38,r=42+(2-stageFlash)*65;let g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,'#ffe9b9aa');g.addColorStop(.35,'#d9f2e988');g.addColorStop(1,'#88dcd000');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.strokeStyle='#ffe4ad';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25+(2-stageFlash)*35,0,6.28);ctx.stroke();for(let i=0;i<stage+2;i++){ctx.fillStyle='#f6d896';starPath(x+Math.cos(t*1.2+i*6.28/(stage+2))*48,y+Math.sin(t*1.2+i*6.28/(stage+2))*30,5);ctx.fill()}ctx.restore()}
function draw(t){drawSky(t);drawWinds(t);drawLandmarks();platforms.forEach(drawPlatform);drawLift(t);gems.forEach(g=>drawGem(g,t));items.forEach(it=>drawItem(it,t));enemies.forEach(e=>drawEnemy(e,t));drawEffects(t);drawHero(t);drawStageFlash(t);if(shake>0){ctx.save();ctx.restore();shake*=.88}}
function damagePlayer(sourceX){if(player.inv>0||powerType==='star')return;if(shields>0){shields--;powerType='';powerTimer=0;burst(player.x+17,player.y+20,'#a6f0e8',18);effects.push({type:'ring',x:player.x+17,y:player.y+22,life:.6,max:.6,color:'#aff7ed'});updatePowerUI();player.inv=.9;return}lives--;updateLives();player.inv=1.25;player.vx=player.x<sourceX?-240:240;player.vy=-290;burst(player.x+17,player.y+20,'#f38d86',10);if(lives<=0){running=false;showCard('fail')}}
function updateEnemy(e,dt,t){if(!e.alive)return;e.cool=Math.max(0,e.cool-dt);const dist=Math.abs((player.x+17)-e.x),nearY=Math.abs((player.y+24)-e.y)<145;if(e.state==='patrol'){e.x+=e.v*65*(1+(stage-1)*.24)*dt;if(e.x<e.a||e.x>e.b)e.v*=-1;e.face=Math.sign(e.v)||1;if(dist<230&&nearY&&e.cool<=0){e.state='windup';e.attackT=.48-(stage-1)*.04;e.attackDir=Math.sign(player.x+17-e.x)||1;e.didHit=false}}else if(e.state==='windup'){e.attackT-=dt;e.attackDir=Math.sign(player.x+17-e.x)||e.attackDir;if(e.attackT<=0){e.state='bite';e.attackT=.24;e.didHit=false}}else if(e.state==='bite'){e.x+=e.attackDir*(430+stage*55)*dt;e.face=e.attackDir;e.attackT-=dt;if(e.attackT<=0){e.state='recover';e.attackT=.48;e.cool=1.0}}else{e.attackT-=dt;if(e.attackT<=0)e.state='patrol'}const hit=player.x+player.w>e.x-28&&player.x<e.x+30&&player.y+player.h>e.y-27&&player.y<e.y+22;if(hit){if(player.dashT>0){e.alive=false;burst(e.x,e.y,'#8ce2db',16)}else if(player.vy>130&&player.y+player.h<e.y+8){e.alive=false;player.vy=-340;player.ground=false;player.platform=null;burst(e.x,e.y,'#f8d27c',14)}else if(e.state==='bite'&&!e.didHit){e.didHit=true;damagePlayer(e.x)}}}
function collectItem(it){it.got=true;const colors={heart:'#f39b91',wing:'#8fe3de',shield:'#bdd7eb',star:'#ffda78'};burst(it.x,it.y,colors[it.type],18);effects.push({type:'ring',x:it.x,y:it.y,life:.8,max:.8,color:colors[it.type]});if(it.type==='heart'){lives=Math.min(3,lives+1);updateLives();return}powerType=it.type;if(it.type==='shield'){shields=1;powerTimer=0}else{shields=0;powerTimer=it.type==='star'?8:10;if(it.type==='star'){player.inv=.25;effects.push({type:'ring',x:player.x+17,y:player.y+22,life:1.2,max:1.2,color:'#f9d779'});burst(player.x+17,player.y+22,'#f8d77b',28)}}updatePowerUI()}
function advanceStage(){if(stage>=3){won=true;running=false;showCard('win',true);return}scoreTotal+=coins;loadStage(stage+1);checkpointX=72;checkpointY=390;player.x=72;player.y=390;player.vx=player.vy=0;player.ground=false;player.platform=null;player.inv=1.4;player.airJumpUsed=false;cam=0;stageFlash=2;effects.push({type:'ring',x:W*.5,y:H*.4,life:1.2,max:1.2,color:'#e8d19c'})}
function update(dt,t){if(!running)return;dt=Math.min(dt,.035);const empowered=powerType==='star',accel=player.ground?1500:970,max=empowered?325:250;let dir=(input.right?1:0)-(input.left?1:0);if(dir){player.vx+=dir*accel*dt;player.vx=Math.max(-max,Math.min(max,player.vx));player.face=dir}else player.vx*=Math.pow(player.ground?.0005:.16,dt);if(Math.abs(player.vx)<4)player.vx=0;
if(input.dash&&player.dashT<=0){player.dashT=empowered?.34:.22;player.vx=player.face*(empowered?650:520);player.vy=Math.min(player.vy,40)}if(player.dashT>0)player.dashT-=dt;
lift.prevX=lift.x;lift.prevY=lift.y;lift.x=lift.baseX+Math.sin(t*.72+stage)*lift.rangeX;lift.y=lift.baseY+Math.sin(t*1.35+stage)*lift.rangeY;if(player.platform===lift){player.x+=lift.x-lift.prevX;player.y+=lift.y-lift.prevY}
if(input.jump&&!player.jumpHeld){if(player.ground){player.vy=-510;player.ground=false;player.airJumpUsed=false;player.land=0}else if(powerType==='wing'&&!player.airJumpUsed){player.vy=-465;player.airJumpUsed=true;burst(player.x+17,player.y+player.h,'#9be8e2',10)}}if(input.jump&&player.vy<0)player.vy-=720*dt;player.jumpHeld=input.jump;const glide=powerType==='wing'&&input.jump&&player.vy>0;player.vy+=(glide?340:1250)*dt;player.vy=Math.min(player.vy,glide?250:760);let oldY=player.y;player.platform=null;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(world-player.w,player.x));player.y+=player.vy*dt;player.ground=false;
for(const p of [...platforms,lift]){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+9&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;player.platform=p;player.airJumpUsed=false;if(p!==lift&&player.x>checkpointX+420){checkpointX=player.x;checkpointY=player.y}}}
for(const z of winds){if(player.x+player.w>z.x&&player.x<z.x+z.w&&player.y+player.h>z.y&&player.y<z.y+z.h){player.vy-=1050*dt;player.vx+=Math.sign((z.x+z.w/2)-(player.x+player.w/2))*40*dt;player.vy=Math.max(-480,player.vy)}}
if(player.y>610){if(powerType==='star'){player.y=335;player.vy=-160;player.inv=.75}else{lives--;updateLives();player.x=checkpointX;player.y=checkpointY;player.vx=player.vy=0;player.inv=1.2;player.platform=null;if(lives<=0){running=false;showCard('fail')}}}
player.anim+=dt;if(player.inv>0&&powerType!=='star')player.inv-=dt;if(powerType&&powerTimer>0){powerTimer-=dt;if(powerTimer<=0){powerTimer=0;powerType='';updatePowerUI()}else document.getElementById('powerFill').style.width=`${Math.max(0,powerTimer/(powerType==='star'?8:10)*100)}%`}if(player.ground&&oldY<player.y)player.land=.12;player.land=Math.max(0,player.land-dt);cam=Math.max(0,Math.min(world-W,player.x-W*.34));stageFlash=Math.max(0,stageFlash-dt);
for(const g of gems)if(!g.got&&Math.hypot((player.x+17)-g.x,(player.y+22)-g.y)<29){g.got=true;coins++;document.getElementById('coins').textContent=coins+'/'+gemTotal;burst(g.x,g.y,'#ffe17b',14);effects.push({type:'ring',x:g.x,y:g.y,life:.62,max:.62,color:'#ffe7a0'})}for(const it of items)if(!it.got&&Math.hypot((player.x+17)-it.x,(player.y+22)-it.y)<30)collectItem(it);
for(const e of enemies)updateEnemy(e,dt,t);for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.type==='spark'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=290*dt;e.vx*=Math.pow(.12,dt)}if(e.life<=0)effects.splice(i,1)}
if(player.x>world-260&&!won)advanceStage()}
function reset(){stage=1;coins=0;scoreTotal=0;lives=3;won=false;cam=0;checkpointX=72;checkpointY=390;stageFlash=0;effects.length=0;powerType='';powerTimer=0;shields=0;loadStage(1);player.x=80;player.y=390;player.vx=player.vy=0;player.platform=null;player.ground=false;player.jumpHeld=false;player.airJumpUsed=false;player.inv=0;player.dashT=0;document.getElementById('coins').textContent='0/'+gemTotal;updatePowerUI();updateLives();document.getElementById('overlay').classList.add('hidden');running=true}
function frame(ms){let t=ms/1000,dt=Math.min(.04,(ms-last)/1000||0);last=ms;update(dt,t);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
async function enterFullscreen(){const root=document.documentElement;try{if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'})}catch{}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}}
document.getElementById('start').addEventListener('click',()=>{reset();enterFullscreen()});document.querySelector('.rotateNotice').addEventListener('pointerdown',()=>enterFullscreen());
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'dash',KeyX:'dash'};window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=true}});window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=false}});
document.querySelectorAll('.ctrl').forEach(b=>{let key=b.dataset.key;const on=e=>{e.preventDefault();input[key]=true;b.classList.add('down')},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
})();
</script></body></html>
