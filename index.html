function updateEnemy(e,dt,t){if(!e.alive)return;e.cool=Math.max(0,e.cool-dt);const dist=Math.abs((player.x+17)-e.x),nearY=Math.abs((player.y+24)-e.y)<145;if(e.state==='patrol'){e.x+=e.v*65*(1+(stage-1)*.24)*dt;if(e.x<e.a||e.x>e.b)e.v*=-1;e.face=Math.sign(e.v)||1;if(dist<230&&nearY&&e.cool<=0){e.state='windup';e.attackT=.82-(stage-1)*.09;e.attackDir=Math.sign(player.x+17-e.x)||1;e.didHit=false;e.windStartX=e.x}}else if(e.state==='windup'){e.attackT-=dt;e.attackDir=Math.sign(player.x+17-e.x)||e.attackDir;e.x+=(e.windStartX-e.x)*Math.min(1,dt*7);if(e.attackT<=0){e.state='bite';e.attackT=.46;e.didHit=false;e.lungeStart=e.x}}else if(e.state==='bite'){const progress=1-Math.max(0,e.attackT)/.46,ease=1-Math.pow(1-progress,2);e.x=e.lungeStart+e.attackDir*(Math.min(112,70+stage*11)*ease);e.face=e.attackDir;e.attackT-=dt;if(e.attackT<=0){e.state='recover';e.attackT=.74;e.cool=1.25;e.recoverX=e.x}}else{e.attackT-=dt;e.x+=(e.recoverX-e.x)*Math.min(1,dt*4);if(e.attackT<=0)e.state='patrol'}const hit=player.x+player.w>e.x-28&&player.x<e.x+30&&player.y+player.h>e.y-27&&player.y<e.y+22;if(hit){if(player.dashT>0){e.alive=false;burst(e.x,e.y,'#8ce2db',16)}else if(player.vy>130&&player.y+player.h<e.y+8){e.alive=false;player.vy=-340;player.ground=false;player.platform=null;burst(e.x,e.y,'#f8d27c',14)}else if(e.state==='bite'&&!e.didHit){e.didHit=true;damagePlayer(e.x)}}}
function collectItem(it){it.got=true;const colors={heart:'#f39b91',wing:'#8fe3de',shield:'#bdd7eb',star:'#ffda78',attack:'#ffc26e'};burst(it.x,it.y,colors[it.type],24);effects.push({type:'ring',x:it.x,y:it.y,life:.8,max:.8,color:colors[it.type]});if(it.type==='attack'){attackStock=Math.min(9,attackStock+2);effects.push({type:'beam',x:it.x,y:it.y,color:'#ffd178',life:1.25,max:1.25});updateStatus();return}if(it.type==='heart'){healStock=Math.min(5,healStock+1);effects.push({type:'beam',x:it.x,y:it.y,color:'#ffb7a0',life:1,max:1});updateStatus();return}powerType=it.type;if(it.type==='shield'){shields=1;powerTimer=0}else{shields=0;powerTimer=it.type==='star'?8:10;if(it.type==='star'){player.inv=.25;effects.push({type:'ring',x:player.x+17,y:player.y+22,life:1.2,max:1.2,color:'#f9d779'});burst(player.x+17,player.y+22,'#f8d77b',28)}}updatePowerUI();updateStatus()}

function updateBoss(dt,t){if(!boss||bossDefeated||!boss.awake)return;boss.timer-=dt;const dx=(player.x+player.w/2)-boss.x;if(boss.state==='patrol'){boss.x+=Math.sin(t*1.2+stage)*42*dt;boss.face=Math.sign(dx)||boss.face;if(Math.abs(dx)<370&&boss.timer<=0){boss.state='windup';boss.timer=.9;boss.attackDir=Math.sign(dx)||1;boss.phase++}}else if(boss.state==='windup'){boss.face=boss.attackDir;if(boss.timer<=0){boss.state='lunge';boss.timer=.58;boss.didHit=false;boss.attackDir=Math.sign(dx)||boss.attackDir}}else if(boss.state==='lunge'){boss.x+=boss.attackDir*(580+stage*45)*dt;if(!boss.didHit&&Math.abs((player.x+17)-boss.x)<76){boss.didHit=true;damagePlayer(boss.x);if(stage===2){player.vx*=.55;bossStatus='slow';setTimeout(()=>{bossStatus='';updateStatus()},1700)}if(stage===3){bossStatus='poison';player.poisonT=3.2;updateStatus()}}if(boss.timer<=0){boss.state='recover';boss.timer=1.2}}else if(boss.state==='recover'||boss.state==='stagger'){if(boss.timer<=0){boss.state='patrol';boss.timer=stage===3?1.6:1.25}}boss.x=Math.max(world-610,Math.min(stage===1?world-405:world-275,boss.x));}

function advanceStage(){if(stage>=3){won=true;running=false;showCard('win',true);return}scoreTotal+=coins;loadStage(stage+1);checkpointX=80;checkpointY=462-player.h;player.x=80;player.y=462-player.h;player.vx=player.vy=0;player.ground=false;player.platform=null;player.inv=1.4;player.airJumpUsed=false;player.lastRitualPad=-1;cam=Math.max(-W*.5,player.x+player.w/2-W*.5);stageFlash=2;effects.push({type:'ring',x:W*.5,y:H*.4,life:1.2,max:1.2,color:'#e8d19c'})}

document.getElementById('start').addEventListener('click',()=>{reset();enterFullscreen()});document.querySelector('.rotateNotice').addEventListener('pointerdown',()=>enterFullscreen());
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowUp:'jump',KeyW:'jump',Space:'jump'};window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=true}if(e.repeat)return;if(e.code==='KeyP')input.dash=true;if(e.code==='KeyO')useAttack();if(e.code==='KeyL')useHeal()});window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=false}if(e.code==='KeyP')input.dash=false});
const joy=document.getElementById('joystick'),knob=document.getElementById('joyKnob');let joyPointer=null;function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.31,len=Math.hypot(dx,dy)||1,k=Math.min(1,lim/len),nx=dx*k,ny=dy*k;knob.style.transform=`translate(${nx}px,${ny}px)`;input.left=nx< -lim*.22;input.right=nx>lim*.22;input.down=ny>lim*.35;input.jump=ny< -lim*.34}function releaseJoy(){joyPointer=null;knob.style.transform='';input.left=input.right=input.down=input.jump=false}joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,releaseJoy));document.querySelectorAll('.ctrl').forEach(b=>{const key=b.dataset.key;const on=e=>{e.preventDefault();if(key==='attack')useAttack();else if(key==='heal')useHeal();else input[key]=true;b.classList.add('down')},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
})();
</script></body></html>
