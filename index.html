<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d2033;color:#fff;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:#81c8e9;overflow:hidden;box-shadow:0 18px 70px #061321aa}.shell:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #07182a55}.game{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;inset:0;pointer-events:none}.stats{position:absolute;top:3.5%;right:3%;display:flex;gap:9px;align-items:center}.pill{min-height:42px;background:#102b46bd;border:1px solid #ffffff50;border-radius:15px;padding:7px 11px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 12px #20406033}.gemIcon{width:19px;height:21px;filter:drop-shadow(0 0 4px #ffd65a)}#coins{color:#fff2bd;font-weight:850;font-size:14px;min-width:26px}.hearts{display:flex;gap:4px}.heart{width:17px;height:16px;fill:#ff9378;filter:drop-shadow(0 1px 3px #e7675b55)}.heart.off{fill:#ffffff45;filter:none}.controls{position:absolute;inset:auto 0 0;height:31%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4% 3%;pointer-events:none}.cluster{display:flex;gap:9px;align-items:flex-end;pointer-events:auto}.ctrl{width:clamp(48px,9vw,80px);height:clamp(48px,9vw,80px);border:1px solid #ffffff80;border-radius:24px;background:#f8fbf2d9;color:#24495b;font-size:clamp(20px,4vw,32px);font-weight:900;box-shadow:0 7px 0 #52758d70,0 10px 24px #15365433;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}.ctrl:active,.ctrl.down{transform:translateY(5px);box-shadow:0 2px 0 #52758d70;background:#fff1c9}.jump{width:clamp(62px,11vw,96px);height:clamp(62px,11vw,96px);border-radius:50%;background:#ffd56a;color:#704721;box-shadow:0 8px 0 #c58d3b}.dash{width:clamp(48px,8vw,68px);height:clamp(48px,8vw,68px);border-radius:50%;font-size:clamp(17px,3vw :fullscreen.shell,:fullscreen .shell{width:100vw;height:100dvh;max-width:none;max-height:none;box-shadow:none}.pill{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:#f4e8c96b}.ctrl{backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:transform .12s ease,filter .18s ease,background .18s ease}.ctrl:hover{filter:brightness(1.07)}.start{transition:transform .14s ease,filter .18s ease}.start:hover{filter:brightness(1.08) drop-shadow(0 0 12px #ffe28b88)}@media(orientation:landscape) and (max-height:600px){.shell{width:100vw;height:100dvh;box-shadow:none}.controls{padding-bottom:max(3%,env(safe-area-inset-bottom))}}

</head><body>
<div class="shell"><canvas class="game" id="game" width="960" height="540" aria-label="雲島快遞隊遊戲畫面"></canvas>

</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),H=540;let W=960,dpr=Math.min(window.devicePixelRatio||1,2);ctx.imageSmoothingEnabled=true;
function resizeGame(){const r=c.getBoundingClientRect();if(!r.width||!r.height)return;dpr=Math.min(window.devicePixelRatio||1,2);W=H*r.width/r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(c.width/W,0,0,c.height/H,0,0)}
window.addEventListener('resize',resizeGame);window.addEventListener('fullscreenchange',resizeGame);window.addEventListener('orientationchange',()=>setTimeout(resizeGame,100));resizeGame();

const trophyIcon='<svg viewBox="0 0 120 120"><path d="M38 19h44v23q0 29-22 35Q38 71 38 42Z" fill="#f4c45f"/><path d="M38 27H20v13q0 21 22 24M82 27h18v13q0 21-22 24" fill="none" stroke="#f4c45f" stroke-width="9" stroke-linecap="round"/><path d="M60 77v18M42 101h36" stroke="#a86445" stroke-width="8" stroke-linecap="round"/><path d="m60 29 4 10 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1Z" fill="#fff3c6"/></svg>';
const failIcon='<svg viewBox="0 0 120 120"><path d="M32 76h55a20 20 0 0 0 1-40 30 30 0 0 0-57 7 17 17 0 0 0 1 33Z" fill="#e8f4ee"/><path d="m48 54 24 24m0-24L48 78" stroke="#df8056" stroke-width="8" stroke-linecap="round"/></svg>';
const gemIcon='<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 22 10 17 25H7L2 10Z" fill="#ffd65a"/><path d="m12 4 5 7-5 10-5-10Z" fill="#fff1a6"/></svg>';
function updateLives(){document.getElementById('lives').innerHTML=Array.from({length:3},(_,i)=>`<svg class="heart${i>=lives?' off':''}" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21 2.8 12.2C-3 6.5 5.3-2.3 12 4.3 18.7-2.3 27 6.5 21.2 12.2Z"/></svg>`).join('')}
function showCard(type,withScore=false){document.getElementById('modalIcon').innerHTML=type==='win'?trophyIcon:type==='fail'?failIcon:foxIcon;const score=document.getElementById('scoreIcon');score.innerHTML=gemIcon+`<span>${coins}/12</span>`;score.classList.toggle('hidden',!withScore);document.getElementById('start').innerHTML=type==='start'?'<svg viewBox="0 0 32 32"><path d="M9 5v22l19-11Z"/></svg>':'<svg viewBox="0 0 32 32"><path d="M25 9a12 12 0 1 0 3 10h-5a7 7 0 1 1-2-7l-4 4h12V4Z"/></svg>';document.getElementById('overlay').classList.remove('hidden')}
const input={left:false,right:false,jump:false,dash:false};let running=false,won=false,coins=0,lives=3,last=0,cam=0,world=3100,shake=0;
updateLives();showCard('start');
const player={x:80,y:390,vx:0,vy:0,w:34,h:48,ground:false,face:1,anim:0,jumpHeld:false,dashT:0,inv:0,land:0};
const platforms=[{x:-100,y:462,w:560,h:120},{x:520,y:420,w:210,h:35},{x:805,y:375,w:200,h:35},{x:1085,y:430,w:190,h:35},{x:1350,y:380,w:225,h:35},{x:1660,y:430,w:180,h:35},{x:1900,y:365,w:240,h:35},{x:2215,y:420,w:180,h:35},{x:2475,y:365,w:220,h:35},{x:2775,y:445,w:430,h:120}];
const gems=[560,650,865,940,1140,1210,1410,1500,1710,1980,2070,2540].map((x,i)=>({x,y:[370,345,320,340,375,360,325,330,375,310,300,310][i],got:false,phase:i*.8}));
const enemies=[{x:880,y:342,v:1.1,a:830,b:970,alive:true},{x:1390,y:347,v:1.35,a:1360,b:1550,alive:true},{x:1950,y:332,v:1.2,a:1920,b:2110,alive:true},{x:2500,y:332,v:1.45,a:2490,b:2670,alive:true}];
const clouds=Array.from({length:15},(_,i)=>({x:i*250+Math.random()*120,y:45+Math.random()*210,s:.45+Math.random()*.85}));
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawSky(t){
let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#345f8b');sky.addColorStop(.34,'#5fa9c2');sky.addColorStop(.72,'#c3d6c5');sky.addColorStop(1,'#f4c98f');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
let sunX=W*.78-cam*.025;let glow=ctx.createRadialGradient(sunX,118,4,sunX,118,180);glow.addColorStop(0,'#fff8d8dd');glow.addColorStop(.25,'#ffe8b566');glow.addColorStop(1,'#ffe1a000');ctx.fillStyle=glow;ctx.fillRect(sunX-190,-60,380,380);ctx.save();ctx.globalAlpha=.12;ctx.fillStyle='#fff5d5';for(let i=0;i<7;i++){let a=-.85+i*.2;ctx.beginPath();ctx.moveTo(sunX,118);ctx.lineTo(sunX+Math.cos(a)*700,118+Math.sin(a)*700);ctx.lineTo(sunX+Math.cos(a+.08)*700,118+Math.sin(a+.08)*700);ctx.fill()}ctx.restore();ctx.fillStyle='#fff1c8';ctx.beginPath();ctx.arc(sunX,118,34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9df88';ctx.beginPath();ctx.arc(sunX-9,108,8,0,Math.PI*2);ctx.fill();
for(let layer=0;layer<3;layer++){ctx.fillStyle=['#719eaca8','#527f92cc','#416c7e'][layer];ctx.beginPath();let base=H*.58+layer*42;ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=-40;x<=W+80;x+=70){let yy=base-Math.sin((x+cam*(.07+layer*.055))/132+layer)*35-Math.sin(x/61+layer)*13;ctx.quadraticCurveTo(x+35,yy-34,x+70,yy)}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
for(let i=0;i<6;i++){let x=((i*365-cam*.18)%(W+500)+W+500)%(W+500)-110,y=210+(i%3)*56;ctx.save();ctx.translate(x,y);ctx.fillStyle='#41697b88';ctx.beginPath();ctx.moveTo(-64,0);ctx.quadraticCurveTo(-30,-22,0,-15);ctx.quadraticCurveTo(35,-24,68,0);ctx.lineTo(45,18);ctx.lineTo(20,22);ctx.lineTo(7,51);ctx.lineTo(-4,24);ctx.lineTo(-40,20);ctx.closePath();ctx.fill();ctx.fillStyle='#b8d8c4aa';ctx.beginPath();ctx.ellipse(0,-5,48,10,0,0,6.28);ctx.fill();ctx.strokeStyle='#d1eee1aa';ctx.lineWidth=3;for(let j=0;j<3;j++){let drip=(t*38+j*19)%52;ctx.beginPath();ctx.moveTo(-11+j*11,15);ctx.lineTo(-11+j*11+Math.sin(t*2+j)*3,15+drip);ctx.stroke()}ctx.restore()}
clouds.forEach((cl,i)=>{let x=((cl.x-cam*(.12*cl.s))%(W+300)+W+300)%(W+300)-100;let y=cl.y;let cg=ctx.createRadialGradient(x,y-7,2,x,y,48*cl.s);cg.addColorStop(0,'#fffdf2');cg.addColorStop(1,'#e9f6efd9');ctx.globalAlpha=.66;ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(x,y,40*cl.s,15*cl.s,0,0,Math.PI*2);ctx.ellipse(x-23*cl.s,y+4,22*cl.s,13*cl.s,0,0,Math.PI*2);ctx.ellipse(x+23*cl.s,y+3,26*cl.s,16*cl.s,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});
for(let i=0;i<18;i++){let px=((i*137+Math.sin(t*.7+i)*22-cam*.04)%(W+20)+W+20)%(W+20)-10,py=(i*79+t*(8+i%4))%(H*.76);ctx.globalAlpha=.18+(.25*Math.sin(t*2+i));ctx.fillStyle=i%3?'#fff5c8':'#ffe292';ctx.beginPath();ctx.arc(px,py,i%4===0?2:1.2,0,6.28);ctx.fill()}ctx.globalAlpha=1;
}
function drawPlatform(p){const x=p.x-cam;if(x+p.w< -40||x>W+40)return;ctx.save();ctx.shadowColor='#163a4f66';ctx.shadowBlur=16;ctx.shadowOffsetY=9;let rock=ctx.createLinearGradient(0,p.y,0,p.y+Math.max(55,p.h));rock.addColorStop(0,'#ab805e');rock.addColorStop(.32,'#806455');rock.addColorStop(.72,'#655553');rock.addColorStop(1,'#465362');ctx.beginPath();ctx.moveTo(x+8,p.y+4);ctx.quadraticCurveTo(x+p.w*.22,p.y-5,x+p.w*.48,p.y+3);ctx.quadraticCurveTo(x+p.w*.78,p.y-4,x+p.w-8,p.y+4);ctx.lineTo(x+p.w-15,p.y+Math.min(p.h,35));ctx.quadraticCurveTo(x+p.w*.78,p.y+Math.min(p.h,55),x+p.w*.64,p.y+Math.min(p.h,44));ctx.lineTo(x+p.w*.53,p.y+Math.min(p.h,Math.max(45,p.h-5)));ctx.lineTo(x+p.w*.43,p.y+Math.min(p.h,Math.max(38,p.h-16)));ctx.quadraticCurveTo(x+p.w*.23,p.y+Math.min(p.h,45),x+12,p.y+Math.min(p.h,30));ctx.closePath();ctx.fillStyle=rock;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
ctx.beginPath();ctx.moveTo(x+5,p.y+7);ctx.quadraticCurveTo(x+p.w*.2,p.y-2,x+p.w*.48,p.y+5);ctx.quadraticCurveTo(x+p.w*.78,p.y-2,x+p.w-5,p.y+7);ctx.lineTo(x+p.w-12,p.y+16);ctx.quadraticCurveTo(x+p.w*.7,p.y+9,x+p.w*.48,p.y+15);ctx.quadraticCurveTo(x+p.w*.25,p.y+10,x+10,p.y+17);ctx.closePath();let turf=ctx.createLinearGradient(0,p.y,0,p.y+20);turf.addColorStop(0,'#c5d88c');turf.addColorStop(.42,'#82b97d');turf.addColorStop(1,'#4b8b70');ctx.fillStyle=turf;ctx.fill();
ctx.strokeStyle='#d1a47777';ctx.lineWidth=2;for(let j=0;j<3;j++){let yy=p.y+25+j*11;if(yy<p.y+Math.min(p.h,48)){ctx.beginPath();ctx.moveTo(x+14,yy);ctx.quadraticCurveTo(x+p.w*.52,yy+7,x+p.w-18,yy-3);ctx.stroke()}}
for(let xx=x+22;xx<x+p.w-18;xx+=58){ctx.strokeStyle=xx%2?'#b8d989':'#4e9273';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,p.y+7);ctx.quadraticCurveTo(xx-3,p.y-1,xx-7,p.y-4);ctx.moveTo(xx+3,p.y+8);ctx.quadraticCurveTo(xx+5,p.y+1,xx+9,p.y-2);ctx.stroke();if(Math.round(xx)%3===0){ctx.fillStyle='#fff1c5';ctx.beginPath();ctx.arc(xx+12,p.y+6,2,0,6.28);ctx.fill()}}
if(p.h>65){ctx.strokeStyle='#b7d5c488';ctx.lineWidth=2;for(let i=0;i<4;i++){let rx=x+p.w*(.2+i*.18),len=12+(i%2)*13;ctx.beginPath();ctx.moveTo(rx,p.y+32);ctx.bezierCurveTo(rx-5,p.y+32+len*.4,rx+7,p.y+32+len*.7,rx+2,p.y+32+len);ctx.stroke()}}
ctx.restore()}
function drawTree(x,y,s){ctx.save();ctx.translate(x-cam,y);ctx.scale(s,s);let trunk=ctx.createLinearGradient(-7,0,7,0);trunk.addColorStop(0,'#614b48');trunk.addColorStop(.5,'#a16e50');trunk.addColorStop(1,'#594956');ctx.fillStyle=trunk;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-4,-38);ctx.lineTo(4,-39);ctx.lineTo(7,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#d19c66';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-1,-8);ctx.lineTo(-2,-32);ctx.stroke();for(const [bx,by] of [[-3,-24],[3,-30]]){ctx.strokeStyle='#805941';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,by+8);ctx.lineTo(bx,by);ctx.stroke()}let leaf=ctx.createRadialGradient(-6,-60,2,0,-47,30);leaf.addColorStop(0,'#a6d78a');leaf.addColorStop(.55,'#5eaa79');leaf.addColorStop(1,'#2d766e');ctx.fillStyle=leaf;for(const [a,b,r] of [[0,-50,21],[-16,-41,16],[15,-41,17],[-9,-60,16],[9,-63,17]]){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#d7e6a0';for(const [a,b] of [[-9,-58],[7,-68],[-19,-43],[14,-42]]){ctx.beginPath();ctx.arc(a,b,3,0,6.28);ctx.fill()}ctx.restore()}
function drawLandmarks(){for(let i=0;i<platforms.length;i++){const p=platforms[i],x=p.x-cam;if(x>-60&&x<W+60&&p.w>160&&p.x>0){drawTree(p.x+65,p.y,1);if(i%2===0)drawTree(p.x+p.w-40,p.y,.72)}}let lx=2850-cam;if(lx>-100&&lx<W+100){let tower=ctx.createLinearGradient(lx,0,lx+20,0);tower.addColorStop(0,'#f9e8bf');tower.addColorStop(.68,'#fff2d2');tower.addColorStop(1,'#d3ad86');ctx.fillStyle=tower;ctx.beginPath();ctx.moveTo(lx-2,294);ctx.lineTo(lx+2,278);ctx.lineTo(lx+9,278);ctx.lineTo(lx+15,294);ctx.lineTo(lx+18,437);ctx.lineTo(lx-7,437);ctx.closePath();ctx.fill();ctx.fillStyle='#c87b5b';ctx.fillRect(lx-10,291,31,6);ctx.fillRect(lx-8,340,25,4);ctx.fillRect(lx-8,391,25,4);let light=ctx.createRadialGradient(lx+6,316,2,lx+6,316,65);light.addColorStop(0,'#fff8ccaa');light.addColorStop(1,'#ffe47800');ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(lx+4,310);ctx.lineTo(lx-72,265);ctx.lineTo(lx+78,265);ctx.closePath();ctx.fill();ctx.fillStyle='#ffc85f';ctx.beginPath();ctx.arc(lx+6,315,8,0,6.28);ctx.fill();ctx.fillStyle='#fff8cc';ctx.beginPath();ctx.arc(lx+6,315,3,0,6.28);ctx.fill();ctx.fillStyle='#b9604e';ctx.beginPath();ctx.moveTo(lx-15,291);ctx.lineTo(lx+6,258);ctx.lineTo(lx+27,291);ctx.closePath();ctx.fill();ctx.fillStyle='#f4dfb6';ctx.beginPath();ctx.arc(lx+6,258,4,Math.PI,0);ctx.fill();ctx.fillStyle='#72524d';ctx.fillRect(lx-4,407,16,30);ctx.fillStyle='#fff1c8';ctx.fillRect(lx+1,412,5,9)}}
function drawGem(g,t){if(g.got)return;let x=g.x-cam,y=g.y+Math.sin(t*3+g.phase)*5;ctx.save();ctx.translate(x,y);ctx.rotate(t*.65+g.phase);ctx.shadowColor='#ffdf63';ctx.shadowBlur=15;ctx.fillStyle='#ffda62';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,-2);ctx.lineTo(5,9);ctx.lineTo(-5,9);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff2a8';ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,-2);ctx.lineTo(0,1);ctx.closePath();ctx.fill();ctx.restore()}
function drawEnemy(e,t){if(!e.alive)return;let x=e.x-cam,y=e.y+Math.sin(t*7+e.x)*2;ctx.save();ctx.translate(x,y);ctx.fillStyle='#486d77';ctx.beginPath();ctx.ellipse(0,6,19,14,0,0,6.28);ctx.fill();ctx.fillStyle='#6fa3a0';ctx.beginPath();ctx.ellipse(-3,0,14,10,0,0,6.28);ctx.fill();ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.arc(5,-3,4,0,6.28);ctx.fill();ctx.fillStyle='#294556';ctx.beginPath();ctx.arc(6,-3,1.7,0,6.28);ctx.fill();ctx.strokeStyle='#35565c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,16);ctx.lineTo(-13,19);ctx.moveTo(10,16);ctx.lineTo(14,19);ctx.stroke();ctx.restore()}
function drawHero(t){let x=player.x-cam,y=player.y;ctx.save();ctx.translate(x+player.w/2,y+player.h);ctx.scale(player.face,1);ctx.scale(1.12,1.12);if(player.dashT>0){ctx.globalAlpha=.55;for(let i=0;i<4;i++){ctx.strokeStyle=i%2?'#fff0b8':'#7de2e1';ctx.lineWidth=2+i%2;ctx.beginPath();ctx.moveTo(-24-i*5,-18-i*5);ctx.lineTo(-39-i*8,-18-i*5);ctx.stroke()}ctx.globalAlpha=1}let moving=Math.abs(player.vx)>.3&&player.ground,phase=player.anim;let bob=player.ground?(moving?Math.abs(Math.sin(phase*12))*2:Math.sin(t*2)*1.3):0;ctx.translate(0,-bob);if(player.inv>0&&Math.floor(t*14)%2===0)ctx.globalAlpha=.45;
// shadow
ctx.fillStyle='#15354a44';ctx.beginPath();ctx.ellipse(0,1,player.ground?24:15,5,0,0,6.28);ctx.fill();
// legs with running frames
let stride=moving?Math.sin(phase*13)*8:0;ctx.strokeStyle='#51444d';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-6,-13);ctx.lineTo(-7+stride,-3);ctx.moveTo(7,-13);ctx.lineTo(7-stride,-3);ctx.stroke();ctx.strokeStyle='#e5794c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-9+stride,-3);ctx.lineTo(-2+stride,-2);ctx.moveTo(5-stride,-3);ctx.lineTo(13-stride,-2);ctx.stroke();
// tail swishes
ctx.strokeStyle='#d56f45';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-11,-27);ctx.quadraticCurveTo(-27,-34+Math.sin(t*8)*4,-21,-42+Math.cos(t*8)*3);ctx.stroke();ctx.strokeStyle='#f7c86c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-20,-40+Math.cos(t*8)*3);ctx.lineTo(-24,-45+Math.cos(t*8)*3);ctx.stroke();
// torso and mail bag
rounded(-12,-34,24,23,8,'#e77e50','#a44d37');rounded(3,-34,13,15,4,'#6a88a0','#354e6c');rounded(5,-31,9,8,2,'#f5d36d');ctx.fillStyle='#d45d54';ctx.beginPath();ctx.moveTo(-10,-36);ctx.quadraticCurveTo(1,-31,11,-36);ctx.lineTo(10,-29);ctx.quadraticCurveTo(1,-25,-10,-30);ctx.closePath();ctx.fill();ctx.fillStyle='#f5d36d';ctx.beginPath();ctx.arc(0,-31,2.3,0,6.28);ctx.fill();ctx.strokeStyle='#f3c16b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-9,-29);ctx.lineTo(9,-22);ctx.stroke();
// arms swing
ctx.strokeStyle='#f2b277';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-10,-28);ctx.lineTo(-17+(moving?Math.sin(phase*13)*5:0),-19);ctx.moveTo(10,-28);ctx.lineTo(17-(moving?Math.sin(phase*13)*5:0),-20);ctx.stroke();
// ears behind head
ctx.fillStyle='#d8754e';ctx.beginPath();ctx.moveTo(-11,-45);ctx.quadraticCurveTo(-18,-62,-7,-58);ctx.lineTo(-2,-45);ctx.fill();ctx.beginPath();ctx.moveTo(3,-45);ctx.quadraticCurveTo(10,-63,16,-54);ctx.lineTo(12,-43);ctx.fill();ctx.fillStyle='#f5bd80';ctx.beginPath();ctx.moveTo(-10,-49);ctx.lineTo(-9,-56);ctx.lineTo(-5,-47);ctx.fill();
// head
ctx.fillStyle='#eea568';ctx.beginPath();ctx.ellipse(1,-43,16,15,0,0,6.28);ctx.fill();ctx.fillStyle='#fff0d7';ctx.beginPath();ctx.ellipse(7,-38,10,7,0,0,6.28);ctx.fill();ctx.fillStyle='#5a4551';ctx.beginPath();ctx.arc(11,-41,2,0,6.28);ctx.fill();ctx.fillStyle='#d26249';ctx.beginPath();ctx.arc(17,-39,2.5,0,6.28);ctx.fill();
// goggles resting above brow
rounded(-9,-54,18,7,3,'#546f82','#263e51');ctx.fillStyle='#b8e8e5';ctx.fillRect(-6,-52,5,3);ctx.fillRect(1,-52,5,3);ctx.restore()}
function draw(t){drawSky(t);drawLandmarks();platforms.forEach(drawPlatform);gems.forEach(g=>drawGem(g,t));enemies.forEach(e=>drawEnemy(e,t));drawHero(t);if(shake>0){shake*=.88}}
function update(dt,t){if(!running)return;dt=Math.min(dt,.035);const accel=player.ground?1500:970,max=250;let dir=(input.right?1:0)-(input.left?1:0);if(dir){player.vx+=dir*accel*dt;player.vx=Math.max(-max,Math.min(max,player.vx));player.face=dir}else player.vx*=Math.pow(player.ground?.0005:.16,dt);if(Math.abs(player.vx)<4)player.vx=0;
if(input.dash&&player.dashT<=0){player.dashT=.22;player.vx=player.face*520;player.vy=Math.min(player.vy,40)}if(player.dashT>0)player.dashT-=dt;
if(input.jump&&!player.jumpHeld&&player.ground){player.vy=-510;player.ground=false;player.land=0}if(input.jump&&player.vy<0)player.vy-=720*dt;player.jumpHeld=input.jump;player.vy+=1250*dt;player.vy=Math.min(player.vy,760);let oldY=player.y;player.x+=player.vx*dt;player.x=Math.max(0,Math.min(world-player.w,player.x));player.y+=player.vy*dt;player.ground=false;
for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+9&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true}}
if(player.y>610){lives--;updateLives();player.x=Math.max(40,player.x-220);player.y=330;player.vx=player.vy=0;player.inv=1.2;if(lives<=0){running=false;showCard('fail')}}
player.anim+=dt;if(player.inv>0)player.inv-=dt;if(player.ground&&oldY<player.y)player.land=.12;player.land=Math.max(0,player.land-dt);cam=Math.max(0,Math.min(world-W,player.x-W*.34));
for(const g of gems)if(!g.got&&Math.hypot((player.x+17)-g.x,(player.y+22)-g.y)<27){g.got=true;coins++;document.getElementById('coins').textContent=coins+'/12'}
for(const e of enemies){if(!e.alive)continue;e.x+=e.v*65*dt;if(e.x<e.a||e.x>e.b)e.v*=-1;if(player.x+player.w>e.x-16&&player.x<e.x+16&&player.y+player.h>e.y-9&&player.y<e.y+20){if(player.vy>120&&player.y+player.h<e.y+12){e.alive=false;player.vy=-300}else if(player.inv<=0){lives--;updateLives();player.inv=1.2;player.vx=-player.face*210;player.vy=-260;if(lives<=0){running=false;showCard('fail')}}}}
if(player.x>world-260&&!won){won=true;running=false;showCard('win',true)}}
function reset(){coins=0;lives=3;won=false;cam=0;player.x=80;player.y=390;player.vx=player.vy=0;player.inv=0;gems.forEach(g=>g.got=false);enemies.forEach((e,i)=>{e.alive=true;e.x=[880,1390,1950,2500][i]});document.getElementById('coins').textContent='0/12';updateLives();document.getElementById('overlay').classList.add('hidden');running=true}
function frame(ms){let t=ms/1000,dt=Math.min(.04,(ms-last)/1000||0);last=ms;update(dt,t);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
async function enterFullscreen(){const root=document.documentElement;try{if(!document.fullscreenElement&&root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'})}catch{}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}}
document.getElementById('start').addEventListener('click',()=>{reset();enterFullscreen()});
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',ShiftLeft:'dash',KeyX:'dash'};window.addEventListener('keydown',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=true}});window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){e.preventDefault();input[k]=false}});
document.querySelectorAll('.ctrl').forEach(b=>{let key=b.dataset.key;const on=e=>{e.preventDefault();input[key]=true;b.classList.add('down')},off=e=>{e.preventDefault();input[key]=false;b.classList.remove('down')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
})();
</script></body></html>
